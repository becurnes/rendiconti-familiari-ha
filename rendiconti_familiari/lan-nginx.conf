daemon off;
master_process off;
worker_processes 1;
pid nginx.pid;
error_log stderr crit;

events {
    worker_connections 64;
}

http {
    server_tokens off;
    access_log off;
    client_body_temp_path body;
    proxy_temp_path proxy;
    fastcgi_temp_path fastcgi;
    uwsgi_temp_path uwsgi;
    scgi_temp_path scgi;

    client_max_body_size 2500000;
    client_header_timeout 8s;
    client_body_timeout 15s;
    keepalive_timeout 15s;
    send_timeout 15s;
    large_client_header_buffers 2 8k;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache off;
    ssl_session_tickets off;

    limit_req_zone $binary_remote_addr zone=per_client:1m rate=5r/s;
    limit_req_zone $server_name zone=all_clients:1m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=connections:1m;

    server {
        listen 0.0.0.0:@PORT@ ssl default_server;
        ssl_reject_handshake on;
        return 421;
    }

    server {
        listen 0.0.0.0:@PORT@ ssl;
        server_name @HOSTNAME@;
        ssl_certificate fullchain.pem;
        ssl_certificate_key privkey.pem;
        add_header Strict-Transport-Security "max-age=86400" always;
        if ($host != @HOSTNAME@) { return 421; }

        location / {
            satisfy all;
            allow @NETWORK@;
            deny all;
            auth_basic "Rendiconti familiari";
            auth_basic_user_file users.htpasswd;

            limit_req zone=per_client burst=12 nodelay;
            limit_req zone=all_clients burst=20 nodelay;
            limit_req_status 429;
            limit_conn connections 8;
            limit_conn_status 429;

            proxy_http_version 1.1;
            proxy_set_header Connection close;
            proxy_pass_request_headers off;
            proxy_set_header Host $host;
            proxy_set_header Content-Type $content_type;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Rendiconti $http_x_rendiconti;
            proxy_set_header X-Rendiconti-Origin https://$http_host;
            proxy_read_timeout 25s;
            proxy_pass http://unix:@RUNTIME@/backend.sock;
        }
    }
}
